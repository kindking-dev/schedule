<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AITU Interactive Map</title>
  <link rel="stylesheet" href="aitumap.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--aitu-map-bg);
      font-family: Inter, Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #mapRoot {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="mapRoot"></div>

  <!-- AITUMAP Vector Data & Engine -->
  <script src="../../config/room-mapping.js"></script>
  <script src="aitumap-data.js"></script>
  <script src="aitumap-viewer.js"></script>
  <script>
    (function() {
      // Check query parameters (e.g. ?room=C1.3.362&theme=dark)
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      const themeParam = params.get('theme') || 'dark';
      const floorParam = parseInt(params.get('floor'), 10) || 1;

      const viewer = new AituMapViewer('#mapRoot', {
        initialFloor: floorParam,
        theme: themeParam,
        enableSearch: true,
        enableControls: true
      });

      window.aituViewer = viewer;

      if (roomParam) {
        setTimeout(function() {
          viewer.openRoom(roomParam);
        }, 300);
      }
    })();
  </script>
</body>
</html>
